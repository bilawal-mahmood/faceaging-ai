<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Aging AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CDN (or your compiled CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative flex flex-col min-h-screen transition-colors duration-500">

  <section id="tryItOut" class="scroll-animate py-20 px-12 mx-auto max-w-full">
    <form id="uploadForm" class="space-y-10 max-w-5xl mx-auto" enctype="multipart/form-data" novalidate>
      <!-- File Upload Box -->
      <div class="upload-area border-2 border-dashed rounded-3xl p-14 text-center bg-[#EFEBE9] shadow-md">
        <label id="uploadLabel" class="text-3xl font-semibold mb-6 block">Upload Your Face Image</label>
        <input id="fileInput" name="file" type="file" accept="image/*" required class="block mx-auto mb-5 w-full max-w-4xl" />
        <p class="text-base text-[#5D4037]">Supported formats: JPG, PNG • Max size: 5MB</p>
      </div>

      <!-- Controls Section -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-10 max-w-5xl mx-auto">
        <div class="w-full sm:w-1/2">
          <label for="conversion" class="text-lg font-medium mb-3 block">Choose Transformation</label>
          <select id="conversion" name="conversion" required class="w-full px-6 py-4 rounded-3xl border bg-white shadow-sm">
            <option value="young_to_old">Young to Old</option>
            <option value="old_to_young">Old to Young</option>
          </select>
        </div>
        <div class="w-full sm:w-1/3 mt-6 sm:mt-0">
          <button type="submit" class="primary-btn bg-[#5D4037] text-white px-8 py-4 rounded-3xl text-xl">Generate</button>
        </div>
      </div>
    </form>

    <!-- Result Section -->
    <div id="result" class="mt-20 text-center max-w-6xl mx-auto">
      <h2 class="text-3xl font-bold mb-8">Result:</h2>
      <img id="outputImage" src="#" alt="Result Image" class="mx-auto rounded-3xl shadow-lg max-w-full" style="display:none;" loading="lazy" />
      <p id="errorMsg" class="text-red-500 mt-4"></p>
    </div>
  </section>

  <script>
    const uploadForm = document.getElementById('uploadForm');
    const outputImage = document.getElementById('outputImage');
    const errorMsg = document.getElementById('errorMsg');

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      outputImage.style.display = 'none';

      const formData = new FormData(uploadForm);

      try {
        const response = await fetch('/convert/', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const html = await response.text();
        console.log("🟢 Response received");

        // Extract base64 image from returned HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const img = doc.querySelector('img');
        if (img) {
          outputImage.src = img.src;
          outputImage.style.display = 'block';
        } else {
          throw new Error("No image found in response.");
        }

      } catch (error) {
        console.error("❌ Upload failed:", error);
        errorMsg.textContent = "Something went wrong. Please try again.";
      }
    });
  </script>
</body>
</html>
