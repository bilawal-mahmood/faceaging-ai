<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Face Aging AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center px-4 py-10">

  <h1 class="text-4xl font-bold mb-8 text-center">Face Aging AI</h1>

  <form id="uploadForm" class="bg-white shadow-lg rounded-xl p-8 w-full max-w-xl space-y-6" enctype="multipart/form-data">
    <div>
      <label class="block text-lg font-semibold mb-2">Upload Face Image</label>
      <input type="file" id="fileInput" name="file" accept="image/*" required class="w-full border rounded-lg p-2" />
    </div>

    <div>
      <label for="conversion" class="block text-lg font-semibold mb-2">Transformation Type</label>
      <select id="conversion" name="conversion" required class="w-full border rounded-lg p-2">
        <option value="young_to_old">Young to Old</option>
        <option value="old_to_young">Old to Young</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
      Generate
    </button>
  </form>

  <div id="resultSection" class="mt-10 text-center hidden">
    <h2 class="text-2xl font-semibold mb-4">Result:</h2>
    <img id="outputImage" src="#" alt="Transformed Face" class="rounded-xl shadow-md mx-auto max-w-xs" />
  </div>

  <p id="errorMsg" class="text-red-600 mt-6"></p>

  <script>
    const form = document.getElementById('uploadForm');
    const outputImage = document.getElementById('outputImage');
    const resultSection = document.getElementById('resultSection');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      resultSection.classList.add("hidden");

      const formData = new FormData(form);

      try {
        const response = await fetch("/convert/", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(errText);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        outputImage.src = `data:image/png;base64,${data.image}`;
        resultSection.classList.remove("hidden");
        console.log("✅ Image received and shown");

      } catch (error) {
        console.error("❌ Error:", error);
        errorMsg.textContent = error.message || "Something went wrong.";
      }
    });
  </script>
</body>
</html>
